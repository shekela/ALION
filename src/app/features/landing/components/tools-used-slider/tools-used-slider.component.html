<section class="tools-used-section-slider">
  <!-- Title above the slider -->
  <div class="tools-title">
    <h1>All in One Product</h1>
  </div>

  <!-- Slider -->
  <div class="tools-slider">
    <div class="tools-slide-track">
      <ng-container *ngFor="let tool of tools.concat(tools)">
        <img [src]="tool.logo" [alt]="tool.name" />
      </ng-container>
    </div>
  </div>

  <!-- Blur edges -->
  <div class="blur-edge left"></div>
  <div class="blur-edge right"></div>
</section>
